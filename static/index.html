<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пресейл ОГВ — дашборд</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <h1 class="topbar__title">Пресейл ОГВ — дашборд</h1>
      <div id="status-line" class="topbar__status">Загрузка…</div>
    </div>
    <nav id="top-nav">
      <button class="topnav__btn topnav__btn--active" data-view="dashboard">Дашборд</button>
      <button class="topnav__btn" data-view="ai">ИИ-аналитик</button>
      <button class="topnav__btn" data-view="backoffice">Бэкофис</button>
    </nav>
    <div class="topbar__actions">
      <input type="file" id="file-input" accept=".xlsx" hidden>
      <button id="upload-btn" class="btn">⬆ Загрузить файл</button>
      <button id="export-btn" class="btn">⬇ Выгрузить Excel</button>
    </div>
  </header>

  <div id="toast" class="toast" hidden></div>

  <section id="view-dashboard">
    <section id="kpi" class="kpi"></section>

    <section class="filters" id="filters">
      <div class="filters__row" id="filters-row"></div>
      <button id="reset-btn" class="btn btn--ghost">Сбросить</button>
    </section>

    <nav class="tabs" id="tabs"></nav>

    <section class="dims" id="dims"></section>

    <section class="content">
      <div class="card chart-card">
        <canvas id="chart"></canvas>
      </div>
      <div class="card table-card">
        <div class="table-wrap">
          <table id="matrix"></table>
        </div>
      </div>
    </section>

    <div id="drill-overlay" class="overlay" hidden>
      <aside class="panel" id="drill-panel">
        <div class="panel__head">
          <h2 id="drill-title">Запросы</h2>
          <button id="drill-close" class="btn btn--ghost">✕</button>
        </div>
        <div class="panel__body">
          <table id="drill-table"></table>
        </div>
      </aside>
    </div>
  </section>

  <section id="view-ai" hidden>
    <div id="chat-suggestions"></div>
    <button id="analyze-btn">Анализ узких мест</button>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" placeholder="Спросите про узкие места процесса…" autocomplete="off">
      <button type="submit">Отправить</button>
    </form>
  </section>

  <section id="view-backoffice" hidden>
    <h2>Настройки LLM</h2>
    <form id="llm-form">
      <label>Провайдер <input id="llm-provider" value="local"></label>
      <label>Base URL <input id="llm-base-url"></label>
      <label>Модель <input id="llm-model"></label>
      <label>Токен <input id="llm-token" placeholder="оставьте пустым, чтобы не менять"></label>
      <button type="submit">Сохранить</button>
      <button type="button" id="llm-test">Проверить связь</button>
    </form>
    <div id="llm-status"></div>
  </section>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
