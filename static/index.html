<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пресейл ОГВ — дашборд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css?v=20260910">
  <link rel="stylesheet" href="style.css?v=20260910">
</head>
<body data-theme="state-1">
  <header class="app-header">
    <a class="brand" href="/" aria-label="Directum">
      <img class="brand-logo" src="logo-directum.svg" alt="Directum">
    </a>
    <div class="app-title">
      <h1>Пресейл ОГВ — дашборд</h1>
      <div id="status-line" class="app-subtitle">Загрузка…</div>
    </div>
    <nav id="top-nav" class="top-nav">
      <button class="topnav__btn topnav__btn--active" data-view="dashboard">Дашборд</button>
      <button class="topnav__btn" data-view="ai">ИИ-аналитик</button>
      <button class="topnav__btn" data-view="backoffice">Бэкофис</button>
    </nav>
    <div class="header-actions">
      <input type="file" id="file-input" accept=".xlsx" hidden>
      <button id="upload-btn" class="btn btn-sm">⬆ Загрузить файл</button>
      <button id="export-btn" class="btn btn-ghost btn-sm">⬇ Выгрузить Excel</button>
    </div>
  </header>

  <div id="toast" class="toast" hidden></div>

  <main class="page">
    <section id="view-dashboard">
      <section id="kpi" class="kpi-grid"></section>

      <section class="filters card" id="filters">
        <div class="filters__row" id="filters-row"></div>
        <button id="reset-btn" class="btn btn-ghost btn-sm">Сбросить</button>
      </section>

      <nav class="tabs" id="tabs"></nav>

      <section class="dims" id="dims"></section>

      <section class="content">
        <div class="card chart-card">
          <canvas id="chart"></canvas>
        </div>
        <div class="card table-card">
          <div class="table-wrap">
            <table id="matrix"></table>
          </div>
        </div>
      </section>

      <div id="drill-overlay" class="overlay" hidden>
        <aside class="panel" id="drill-panel">
          <div class="panel__head">
            <h2 id="drill-title">Запросы</h2>
            <button id="drill-close" class="btn btn-ghost btn-sm">✕</button>
          </div>
          <div class="panel__body">
            <table id="drill-table"></table>
          </div>
        </aside>
      </div>
    </section>

    <section id="view-ai" hidden>
      <div class="card ai-card">
        <div class="section-heading">
          <div>
            <h2>ИИ-аналитик процесса</h2>
            <p>Вопросы по данным пресейла и поиск узких мест — числа берутся из системы, без домыслов.</p>
          </div>
          <button id="analyze-btn" class="btn btn-sm">Анализ узких мест</button>
        </div>
        <label class="agent-toggle"><input type="checkbox" id="agent-mode"> Глубокий анализ (код)</label>
        <div id="chat-suggestions"></div>
        <div id="chat-log"></div>
        <form id="chat-form">
          <input id="chat-input" placeholder="Спросите про узкие места процесса…" autocomplete="off">
          <button type="submit" class="btn">Отправить</button>
        </form>
      </div>
    </section>

    <section id="view-backoffice" hidden>
      <div class="card backoffice-card">
        <div class="section-heading">
          <div>
            <h2>Настройки LLM</h2>
            <p>Доступ к языковой модели. Токен хранится локально и в интерфейсе маскируется.</p>
          </div>
        </div>
        <form id="llm-form" class="settings-grid">
          <label class="field"><span>Провайдер</span><input id="llm-provider" value="local"></label>
          <label class="field"><span>Base URL</span><input id="llm-base-url" placeholder="https://…/v1"></label>
          <label class="field"><span>Модель</span><input id="llm-model" placeholder="Qwen/Qwen3.8-27B"></label>
          <label class="field"><span>Токен</span><input id="llm-token" placeholder="оставьте пустым, чтобы не менять"></label>
          <div class="settings-actions">
            <button type="submit" class="btn">Сохранить</button>
            <button type="button" id="llm-test" class="btn btn-ghost">Проверить связь</button>
          </div>
        </form>
        <div id="llm-status" class="settings-status"></div>
      </div>
    </section>
  </main>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js?v=20260910"></script>
</body>
</html>
